name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Node 22 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Run real DSH contract tests for each supported CLI
        run: |
          for version in $(node --input-type=module -e 'import { SUPPORTED_DSH_VERSIONS } from "./src/core/registry.ts"; console.log(SUPPORTED_DSH_VERSIONS.join(" "))'); do
            npm install --global "@deepseek-ai/dsh@$version"
            pnpm exec vitest run --config vitest.contract.config.ts --reporter=verbose
          done

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Inspect release package
        run: npm pack --dry-run

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
